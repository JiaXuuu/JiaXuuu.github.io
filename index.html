<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Jelly Sliding is a colorful block puzzle game by JIAXU CHENG.">
  <title>Jelly Sliding</title>
  <style>
    :root { color-scheme: light; --ink:#382b43; --muted:#6c6571; --line:#e8deeb; --accent:#7350a2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#f6f2f8,#fff5df); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(640px,100%); padding:clamp(28px,7vw,56px); background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 14px 42px #3c285016; }
    h1 { margin:0; font-size:clamp(32px,8vw,48px); line-height:1.1; letter-spacing:-.03em; }
    p { margin:14px 0 26px; color:var(--muted); }
    a { display:inline-block; padding:12px 18px; border-radius:999px; background:var(--accent); color:#fff; font-weight:650; text-decoration:none; }
    a:focus-visible { outline:3px solid #e6ad42; outline-offset:3px; }
    footer { margin-top:28px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <h1>Jelly Sliding</h1>
    <p>A colorful block puzzle game by JIAXU CHENG.</p>
    <a href="https://jiaxuuu.github.io/jellyslide-privacy/">Privacy Policy</a>
    <footer>© 2026 JIAXU CHENG</footer>
  </main>
</body>
</html>
